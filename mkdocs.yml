site_name: perms.io docs
site_url: https://docs.perms.io/
theme:
  name: material
  logo: assets/favicon.png
  favicon: assets/favicon.png
  palette:
    scheme: slate
    color: custom
  features:
    - content.code.copy
    - content.code.annotate
    - content.code.highlight: false
    - content.tabs.link
    - navigation.sections
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
    - How it works: how-it-works.md
    - Resources and inheritance: concepts/resources.md
    - Groups: concepts/groups.md
    - API keys: concepts/api-keys.md
    - IAM fundamentals: iam-basics.md
  - Guides:
    - Filtering lists and share dialogs: guides/filtering-and-sharing.md
  - TypeScript SDK: sdk/typescript.md
  - API Reference:
    - Overview: api-reference/index.md
    - Permissions & Roles: api-reference/permissions.md
    - Organisations & Projects: api-reference/organizations.md
    - Pagination: api-reference/pagination.md

# Files pulled into pages with --8<--. snippets/hosts.md holds the API hosts, so
# a host change (e.g. production moving to api.perms.io) is a one-file edit.
watch:
  - snippets

extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_style: lightbulb
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [snippets]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
