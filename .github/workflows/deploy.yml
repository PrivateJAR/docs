name: ci
on:
  push:
    branches:
      - master
      - main
  pull_request:
  # Sent by the perms.io deploy, so llms.txt picks up the new shared header.
  repository_dispatch:
    types: [facts-updated]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check llms-full.txt is up to date
        run: npm run check:llms
      # Fails on broken internal links and anchors (starlight-links-validator).
      - run: npx astro build
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Regenerates public/llms-full.txt and writes public/llms.txt, both starting with the header perms.io
      # publishes (current SDK versions, pricing), then builds the site into dist/.
      - run: python3 scripts/build_llms_full.py --header-url https://perms.io/llms-header.md
      - run: npx astro build
      # Publish dist/ to the gh-pages branch, which GitHub Pages serves at docs.perms.io (public/CNAME).
      # .nojekyll stops Pages from dropping Astro's _astro/ asset folder.
      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -q -m "Deployed ${GITHUB_SHA::7} with Astro Starlight"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
